# `name` MUST match the directory Hermes finds it in: hermes_cli/plugins_cmd.py
# resolves a plugin's toolset from disk as `<plugins dir>/<name>`, and
# scripts/install.sh links this directory in as `~/.hermes/plugins/hermes_control`.
name: hermes_control
kind: standalone
version: 0.2.0
description: Delegate coding tasks to the claude, codex and gemini CLIs in isolated git worktrees
author: JanniezRubyjane
license: MIT
# Without this, `_get_plugin_toolset_key` cannot resolve `control` from disk and
# `hermes plugins enable hermes_control` never adds the toolset.
provides_tools:
  - control_dispatch
  - control_status

# Tested: macOS 26.7; agent plugin: Hermes Agent v0.22.5 (2026.9.24); desktop plugin: a Hermes desktop development build from upstream main, commit 4dc56fe (2026-10-23); claude 2.1.314; codex-cli 0.161.0; Antigravity CLI (agy) 1.4.12 on macOS.
